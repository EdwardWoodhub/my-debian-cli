name: Build CLI ISO

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-iso:
    name: Build Installer ISO (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure host for osbuild privileged mounts
        run: |
          sudo mkdir -p /run/osbuild
          sudo mount --bind /run/osbuild /run/osbuild
          sudo mount --make-shared /run/osbuild
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull installer base and target Debian bootc image
        run: |
          sudo podman pull quay.io/centos-bootc/centos-bootc:stream10
          sudo podman pull ghcr.io/edwardwoodhub/my-debian-cli:latest

      - name: Build ISO with bootc-image-builder
        run: |
          sudo mkdir -p output
          sudo podman run --rm --privileged \
            --pid=host \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v /run/osbuild:/run/osbuild:rshared \
            -v /dev:/dev \
            -v "$(pwd)/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --installer-payload-ref ghcr.io/edwardwoodhub/my-debian-cli:latest \
            quay.io/centos-bootc/centos-bootc:stream10

      - name: Rename and checksum ISO
        run: |
          sudo chown -R "$(id -u):$(id -g)" output
          ISO_FILE=$(find output -name "*.iso" | head -n1)
          mv "$ISO_FILE" output/my-debian-cli-amd64.iso
          (cd output && sha256sum my-debian-cli-amd64.iso > my-debian-cli-amd64.iso.sha256)
          ls -lh output/

      - name: Upload ISO to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view install-iso >/dev/null 2>&1; then
            gh release create install-iso \
              --title "install-iso" \
              --notes "Bootable CLI installer ISO for my-debian-cli"
          fi
          gh release upload install-iso \
            output/my-debian-cli-amd64.iso \
            output/my-debian-cli-amd64.iso.sha256 \
            --clobber
