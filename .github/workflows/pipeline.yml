name: Full Pipeline

on:
  workflow_dispatch:
    inputs:
      update_base:
        description: 'Rebuild debian-bootc base image first (triggers its pipeline and waits)'
        type: boolean
        default: false
      rebuild_env:
        description: 'Rebuild the :buildenv toolchain image first (needed once to seed it, or after editing env.yml)'
        type: boolean
        default: false
      run_debs:
        description: 'Build .deb packages'
        type: boolean
        default: false
      run_iso:
        description: 'Build ISO'
        type: boolean
        default: true
      run_image:
        description: 'Build container image'
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  packages: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: EdwardWoodhub/DaemonCores-CI/.github/workflows/full-pipeline.yml@main
    with:
      enable_base: true
      update_base: ${{ inputs.update_base }}
      rebuild_env: ${{ inputs.rebuild_env }}
      run_debs: ${{ inputs.run_debs }}
      run_image: ${{ inputs.run_image }}
      run_iso: ${{ inputs.run_iso }}
      run_img_rpi: 'false'
      run_img_gallium: 'false'
    secrets: inherit
